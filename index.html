  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background:#050505; }
    body {
      color:#fff;
      font-family: Impact, "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      overflow-x:hidden;
    }
    .page {
      min-height:100svh;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#050505;
    }
    .phone {
      position:relative;
      width:100%;
      max-width:430px;
      min-height:100svh;
      overflow:hidden;
      background:#050505;
    }
    .bg {
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      object-position:center center;
      z-index:0;
      pointer-events:none;
    }
    .shade {
      position:absolute; inset:0;
      z-index:1;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.28) 35%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.88) 100%);
    }
    .content {
      position:relative;
      z-index:2;
      min-height:100svh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding: clamp(34px, 7svh, 68px) 22px max(22px, env(safe-area-inset-bottom));
      text-align:center;
    }
    .top { padding-top: clamp(18px, 4svh, 34px); }
    h1 {
      font-size: clamp(44px, 12vw, 66px);
      line-height:.86;
      letter-spacing:.01em;
      text-transform:uppercase;
      font-weight:900;
      color:#fff;
      text-shadow: 0 5px 22px rgba(0,0,0,.72);
      margin:0 auto 26px;
      max-width:390px;
    }
    .sub {
      font-size: clamp(20px, 5vw, 31px);
      line-height:1.42;
      letter-spacing:.28em;
      text-transform:uppercase;
      font-weight:900;
      color:#fff;
      text-shadow: 0 5px 18px rgba(0,0,0,.82);
      margin:0 auto;
      max-width:380px;
    }
    .bottom { width:100%; }
    .spots {
      display:grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap:14px;
      align-items:center;
      width:100%;
      margin:0 auto 18px;
    }
    .old {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: clamp(15px, 4vw, 18px);
      color:rgba(255,255,255,.66);
      text-decoration:line-through;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .left {
      background:#ef2e2e;
      color:#fff;
      border-radius:8px;
      padding:13px 22px;
      font-size: clamp(21px, 5vw, 29px);
      line-height:1;
      letter-spacing:.08em;
      font-weight:900;
      white-space:nowrap;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      width:100%;
      min-height:76px;
      border-radius:999px;
      border:0;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(180deg, #30b8f2 0%, #168bd8 100%);
      box-shadow:0 12px 32px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.28);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      font-size: clamp(33px, 8vw, 45px);
      font-weight:900;
      letter-spacing:.01em;
      font-family: Impact, "Arial Narrow", Arial, sans-serif;
    }
    .btn:active { transform:scale(.985); }
    .tg-icon {
      width:50px; height:50px;
      flex:0 0 auto;
      border-radius:50%;
      background:#fff;
      display:grid;
      place-items:center;
    }
    .tg-icon svg { width:29px; height:29px; display:block; }
    .hint {
      margin-top:10px;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size:13px;
      color:rgba(255,255,255,.36);
    }
    @media (max-width: 380px) {
      .content { padding-left:16px; padding-right:16px; }
      h1 { font-size:42px; }
      .sub { font-size:18px; letter-spacing:.22em; }
      .left { font-size:19px; padding:12px 16px; }
      .btn { min-height:68px; font-size:30px; }
      .tg-icon { width:44px; height:44px; }
    }
    @media (min-width: 700px) {
      .page { padding:28px; }
      .phone {
        min-height:760px;
        height:min(900px, calc(100vh - 56px));
        border-radius:34px;
        box-shadow:0 24px 90px rgba(0,0,0,.58);
      }
      .content { min-height:100%; padding:48px 28px 26px; }
      h1 { font-size:58px; }
      .sub { font-size:25px; }
      .btn { min-height:72px; font-size:39px; }
      .left { font-size:25px; }
    }
  </style>

<script>
function goTG(e) {
  if (typeof trackMetaLeadOnce === 'function') { trackMetaLeadOnce('goTG_function'); }
  e.preventDefault();
  gtag('event', 'tg_button_click', {
    event_category: 'engagement',
    event_label: 'telegram_button'
  });
  setTimeout(function() {
    window.location.href = "https://t.me/dailydollar7_bot?start=rmKrtQktgKZ";
  }, 200);
}
</script>




<script>
(function() {
  var LEAD_FIRED_KEY = 'meta_lead_fired_dailyflow_v2';
  var EVENT_ID_KEY = 'meta_lead_event_id_dailyflow_v2';

  function normalizeEmail(value) {
    return (value || '').trim().toLowerCase();
  }

  function normalizePhone(value) {
    return (value || '').replace(/[^0-9]/g, '');
  }

  async function sha256(value) {
    if (!value || !window.crypto || !window.crypto.subtle) return null;
    var data = new TextEncoder().encode(value);
    var hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
    return Array.prototype.map.call(new Uint8Array(hashBuffer), function(byte) {
      return ('00' + byte.toString(16)).slice(-2);
    }).join('');
  }

  function getOrCreateEventId() {
    var existing = localStorage.getItem(EVENT_ID_KEY);
    if (existing) return existing;

    var eventId = 'lead_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    localStorage.setItem(EVENT_ID_KEY, eventId);
    return eventId;
  }

  function findInputValue(selectors) {
    for (var i = 0; i < selectors.length; i++) {
      var input = document.querySelector(selectors[i]);
      if (input && input.value) return input.value;
    }
    return '';
  }

  async function collectMatchingParams() {
    var rawEmail = findInputValue([
      'input[type="email"]',
      'input[name="email"]',
      'input[name="mail"]',
      'input[id*="email"]',
      'input[id*="mail"]'
    ]);

    var rawPhone = findInputValue([
      'input[type="tel"]',
      'input[name="phone"]',
      'input[name="tel"]',
      'input[id*="phone"]',
      'input[id*="tel"]'
    ]);

    var params = {};

    var email = normalizeEmail(rawEmail);
    var phone = normalizePhone(rawPhone);

    var hashedEmail = await sha256(email);
    var hashedPhone = await sha256(phone);

    if (hashedEmail) params.em = hashedEmail;
    if (hashedPhone) params.ph = hashedPhone;

    return params;
  }

  async function trackLeadOnce(source) {
    try {
      if (localStorage.getItem(LEAD_FIRED_KEY) === '1') return false;
      localStorage.setItem(LEAD_FIRED_KEY, '1');

      var eventID = getOrCreateEventId();
      var matchingParams = await collectMatchingParams();

      var leadParams = Object.assign({
        content_name: 'Telegram Bot Button',
        content_category: 'Landing',
        currency: 'USD',
        value: 0,
        source: source || 'conversion_button'
      }, matchingParams);

      if (typeof fbq === 'function') {
        // Standard Meta event only.
        fbq('track', 'Lead', leadParams, {eventID: eventID});
      }

      if (typeof gtag === 'function') {
        gtag('event', 'tg_button_click', {
          event_category: 'engagement',
          event_label: source || 'conversion_button'
        });
      }

      return true;
    } catch (e) {
      return false;
    }
  }

  window.trackMetaLeadOnce = trackLeadOnce;

  function bindConversionButtons() {
    var selectors = [
      '.btn',
      '[data-conversion-button]',
      'a[href*="t.me"]',
      'a[href*="telegram"]'
    ];

    selectors.forEach(function(selector) {
      document.querySelectorAll(selector).forEach(function(el) {
        if (el.dataset.metaLeadBound === '1') return;
        el.dataset.metaLeadBound = '1';

        el.addEventListener('click', function(e) {
          var targetUrl = el.getAttribute('href');

          if (targetUrl) {
            e.preventDefault();
          }

          trackLeadOnce('button_click');

          setTimeout(function() {
            if (targetUrl) {
              window.location.href = targetUrl;
            }
          }, 500);
        });
      });
    });
  }

  function checkConfirmationUrl() {
    var path = window.location.pathname || '';
    if (path.indexOf('/thank-you') !== -1 || path.indexOf('/thanks') !== -1) {
      trackLeadOnce('thank_you_page');
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    bindConversionButtons();
    checkConfirmationUrl();
  });

  // SPA support: re-check buttons and confirmation URL after history changes.
  ['pushState', 'replaceState'].forEach(function(type) {
    var original = history[type];
    history[type] = function() {
      var result = original.apply(this, arguments);
      setTimeout(function() {
        bindConversionButtons();
        checkConfirmationUrl();
      }, 50);
      return result;
    };
  });

  window.addEventListener('popstate', function() {
    setTimeout(function() {
      bindConversionButtons();
      checkConfirmationUrl();
    }, 50);
  });
})();
</script>
