<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: #080808;
    -webkit-font-smoothing: antialiased;
  }

  body {
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
  }

  .page {
    min-height: 100svh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
  }

  .phone {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-height: 100svh;
    overflow: hidden;
    background: #0a0a0a;
  }

  /* ─── REAL PHOTO BACKGROUND ─── */
  .bg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 18%;
    z-index: 0;
    pointer-events: none;
    /* slight desaturation so gold text pops */
    filter: saturate(0.85) brightness(0.75);
    transform: scale(1.03);
  }

  /* ─── MULTI-LAYER GRADIENT OVERLAY ─── */
  /* Layer 1: dark top bar — readability for eyebrow */
  /* Layer 2: keep mid clear so the person shows */
  /* Layer 3: heavy dark bottom — button area readable */
  .shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        rgba(5,5,5,0.62) 0%,
        rgba(5,5,5,0.18) 22%,
        rgba(5,5,5,0.08) 42%,
        rgba(5,5,5,0.45) 62%,
        rgba(5,5,5,0.88) 78%,
        rgba(5,5,5,0.97) 100%
      );
  }

  /* warm gold glow from bottom — ties into brand */
  .shade::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 90% 45% at 50% 100%, rgba(197,162,87,0.13) 0%, transparent 65%);
  }

  /* subtle vignette on edges */
  .shade::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 55%, rgba(5,5,5,0.55) 100%);
  }

  /* ─── CONTENT ─── */
  .content {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(36px, 8svh, 72px) 26px max(28px, env(safe-area-inset-bottom));
    text-align: center;
  }

  .top {
    padding-top: clamp(14px, 3svh, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* gold divider eyebrow */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeDown 0.8s 0.2s ease forwards;
  }
  .eyebrow-line {
    flex: 1;
    max-width: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c5a257);
  }
  .eyebrow-line.r { background: linear-gradient(90deg, #c5a257, transparent); }
  .eyebrow-text {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #c5a257;
    white-space: nowrap;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(50px, 13.5vw, 78px);
    font-weight: 300;
    line-height: 0.90;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    /* strong text-shadow so it reads on photo */
    text-shadow:
      0 2px 8px rgba(0,0,0,0.9),
      0 6px 30px rgba(0,0,0,0.7);
    margin: 0 auto 8px;
    max-width: 400px;
    opacity: 0;
    animation: fadeDown 0.9s 0.4s ease forwards;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: #e8d49a;
    text-shadow:
      0 2px 8px rgba(0,0,0,0.9),
      0 0 28px rgba(197,162,87,0.35);
  }

  .sub {
    font-size: clamp(10.5px, 2.6vw, 12.5px);
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    margin: 16px auto 0;
    max-width: 310px;
    line-height: 1.8;
    opacity: 0;
    animation: fadeDown 1s 0.65s ease forwards;
  }

  /* ─── CHANNEL NAME BADGE — key recognition element ─── */
  .channel-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(10,10,10,0.62);
    border: 1px solid rgba(197,162,87,0.35);
    border-radius: 100px;
    padding: 8px 16px;
    margin-top: 22px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    animation: fadeDown 0.9s 0.85s ease forwards;
  }
  .channel-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #c5a257;
    flex-shrink: 0;
  }
  .channel-name {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #c5a257;
  }

  /* ─── BOTTOM ─── */
  .bottom {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .gold-rule {
    width: 1px;
    height: 48px;
    background: linear-gradient(180deg, transparent, rgba(197,162,87,0.5), transparent);
    margin: 0 auto 20px;
    opacity: 0;
    animation: fadeUp 0.7s 1.0s ease forwards;
  }

  /* urgency badge */
  .urgency {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(10,10,10,0.55);
    border: 1px solid rgba(197,162,87,0.28);
    border-radius: 100px;
    padding: 7px 16px;
    margin-bottom: 20px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    animation: fadeUp 0.8s 1.1s ease forwards;
  }
  .urgency-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c5a257;
    animation: pulse 1.6s infinite;
  }
  .urgency-text {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #c5a257;
  }

  /* CTA */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    width: 100%;
    min-height: 66px;
    border-radius: 6px;
    border: 0;
    text-decoration: none;
    background: linear-gradient(135deg, #d4aa5a 0%, #c5a257 45%, #b8913e 100%);
    box-shadow:
      0 0 0 1px rgba(197,162,87,0.35),
      0 8px 32px rgba(197,162,87,0.25),
      0 2px 8px rgba(0,0,0,0.5);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    opacity: 0;
    animation: fadeUp 0.9s 1.25s ease forwards;
  }
  .btn:active {
    transform: scale(0.975);
    box-shadow: 0 4px 16px rgba(197,162,87,0.2);
  }

  .tg-wrap {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(8,8,8,0.2);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .tg-wrap svg { width: 20px; height: 20px; display: block; }

  .btn-label {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(12.5px, 3.2vw, 14.5px);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #080808;
  }
  .btn-arrow { font-size: 16px; color: rgba(8,8,8,0.65); margin-left: 2px; }

  .hint {
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.26);
    opacity: 0;
    animation: fadeUp 0.8s 1.45s ease forwards;
  }
  .hint span { margin: 0 7px; opacity: 0.4; }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.78); }
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 380px) {
    .content { padding-left: 18px; padding-right: 18px; }
    h1 { font-size: 44px; }
    .btn { min-height: 60px; }
  }
  @media (min-width: 700px) {
    .page { padding: 28px; }
    .phone {
      min-height: 760px;
      height: min(900px, calc(100vh - 56px));
      border-radius: 28px;
      box-shadow: 0 32px 100px rgba(0,0,0,0.75);
    }
    .content { min-height: 100%; padding: 52px 32px 32px; }
    h1 { font-size: 70px; }
  }
</style>
</head>
